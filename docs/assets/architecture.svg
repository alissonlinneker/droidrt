      <rect x="288" y="234" width="4" height="36" rx="2" fill="#7C5CDB"/>
      <text x="308" y="248" class="s tx b" font-size="17" text-anchor="start">MCP server</text><text x="308" y="271" class="s mu" font-size="14" text-anchor="start">droidrt_mcp tools</text></g><g>
      <rect x="64" y="300" width="432" height="64" rx="12" fill="#FFFFFF" stroke="#D1D9E0" filter="url(#sh2)"/>
      <rect x="64" y="314" width="4" height="36" rx="2" fill="#3DDC84"/>
      <text x="84" y="328" class="s tx b" font-size="17" text-anchor="start">droidrt CLI</text><text x="84" y="351" class="s mu" font-size="14" text-anchor="start">install, launch, VM lifecycle, idle shutdown</text></g><g>
      <rect x="64" y="380" width="208" height="64" rx="12" fill="#FFFFFF" stroke="#D1D9E0" filter="url(#sh2)"/>
      <rect x="64" y="394" width="4" height="36" rx="2" fill="#A0A8B4"/>
      <text x="84" y="408" class="s tx b" font-size="17" text-anchor="start">iconkit</text><text x="84" y="431" class="s mu" font-size="14" text-anchor="start">icon compositor</text></g><g>
      <rect x="288" y="380" width="208" height="64" rx="12" fill="#FFFFFF" stroke="#D1D9E0" filter="url(#sh2)"/>
      <rect x="288" y="394" width="4" height="36" rx="2" fill="#2F6FEB"/>
      <text x="308" y="408" class="s tx b" font-size="17" text-anchor="start">scrcpy windows</text><text x="308" y="431" class="s mu" font-size="14" text-anchor="start">one window per app</text></g><g>
      <rect x="64" y="460" width="432" height="64" rx="12" fill="#FFFFFF" stroke="#D1D9E0" filter="url(#sh2)"/>
      <rect x="64" y="474" width="4" height="36" rx="2" fill="#A0A8B4"/>
      <text x="84" y="488" class="s tx b" font-size="17" text-anchor="start">Android Emulator (headless)</text><text x="84" y="511" class="s mu" font-size="14" text-anchor="start">qemu, -no-window, -gpu host</text></g><g>
