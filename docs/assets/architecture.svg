  <rect width="1280" height="760" rx="24" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="1279" height="759" rx="23.5" fill="none" stroke="#D1D9E0"/>
  <use href="#logo" x="40" y="30" width="44" height="44"/>
  <text x="98" y="60" class="s tx b" font-size="26" text-anchor="start">droidrt architecture</text>
  <text x="1240" y="60" class="s mu" font-size="16" text-anchor="end">one headless VM, many native windows</text>
  <rect x="64" y="100" width="208" height="44" rx="22" fill="#EEF2F6" stroke="#D1D9E0"/>
  <text x="168" y="128" class="s tx sb" font-size="15" text-anchor="middle">User: Dock, Spotlight</text>
