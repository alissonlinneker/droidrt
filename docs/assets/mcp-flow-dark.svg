      <circle cx="28" cy="13.0" r="4.5" fill="#FEBC2E"/>
      <circle cx="42" cy="13.0" r="4.5" fill="#28C840"/>
      <text x="104.0" y="17.5" class="s mu sb" font-size="12.5" text-anchor="middle">App window</text>
      <rect width="180" height="300" rx="10" fill="none" stroke="#30363D" stroke-opacity="0.8"/>
      <rect x="12" y="40" width="96" height="22" rx="11" fill="#262C36"/><rect x="84" y="70" width="84" height="22" rx="11" fill="#3DDC84"/><rect x="12" y="100" width="112" height="36" rx="12" fill="#262C36"/><rect x="98" y="144" width="70" height="22" rx="11" fill="#3DDC84"/><rect x="12" y="174" width="80" height="22" rx="11" fill="#262C36"/><rect x="10" y="270" width="134" height="20" rx="10" fill="#262C36"/><circle cx="158" cy="280" r="10" fill="#3DDC84"/><path d="M154 276 L163 280 L154 284 Z" fill="#FFFFFF"/>
    </g><g fill="none" stroke-width="3">
      <path d="M234 220 H270" stroke="#2CC572" marker-end="url(#ah-g)"/>
      <path d="M554 220 H590" stroke="#2CC572" marker-end="url(#ah-g)"/>
      <path d="M772 220 H808" stroke="#A78BFA" marker-end="url(#ah-p)"/>
      <path d="M1016 220 H1052" stroke="#2CC572" marker-end="url(#ah-g)"/>
    </g>
    <text x="254.0" y="208" class="s mu sb" font-size="13" text-anchor="middle">call</text>
    <text x="574.0" y="208" class="s mu sb" font-size="13" text-anchor="middle">auth</text>
    <text x="792.0" y="208" class="s mu sb" font-size="13" text-anchor="middle">JSON</text>
    <text x="1036.0" y="208" class="s mu sb" font-size="13" text-anchor="middle">act</text>
<path d="M1150.0 406 V440 H135.0 V410" fill="none" stroke="#4C8DFF" stroke-width="3" marker-end="url(#ah-b)"/>
    <rect x="490.0" y="424" width="300" height="32" rx="16" fill="#0D1117" stroke="#4C8DFF"/>
    <text x="640.0" y="445" class="s sb" font-size="14" text-anchor="middle" fill="#79A8FF">tree and screenshot flow back</text>
<g>
