      <text x="836" y="236" class="s mu" font-size="14" text-anchor="start">inside the VM</text>
      <rect x="836" y="260" width="156" height="34" rx="8" fill="#262C36"/>
      <text x="848" y="282" class="s tx sb" font-size="14" text-anchor="start">Accessibility</text>
      <rect x="836" y="302" width="156" height="34" rx="8" fill="#262C36"/>
      <text x="848" y="324" class="s tx sb" font-size="14" text-anchor="start">Notifications</text>
      <rect x="836" y="344" width="156" height="34" rx="8" fill="#262C36"/>
      <text x="848" y="366" class="s tx sb" font-size="14" text-anchor="start">Gestures, text</text>
    </g><g transform="translate(1060 100)">
