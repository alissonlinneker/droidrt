<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="680" viewBox="0 0 1280 680" role="img" aria-labelledby="t d">
  <title id="t">droidrt MCP automation flow</title>
  <desc id="d">An MCP client calls droidrt_mcp tools such as get_screen, tap and type_text. The server authenticates to the accessibility agent in the VM with an HMAC handshake, the agent acts on the app, and the accessibility tree plus a screenshot flow back to the client.</desc>
  <style>
    .s { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif; }
    .m { font-family: ui-monospace, 'SF Mono', Menlo, monospace; }
    .tx { fill: #E6EDF3; }
    .mu { fill: #9198A1; }
    .b { font-weight: 700; }
    .sb { font-weight: 600; }
  </style>
  <defs>
    <linearGradient id="lg-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232A36"/><stop offset="1" stop-color="#0F131A"/>
    </linearGradient>
    <linearGradient id="lg-win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E9EDF2"/>
    </linearGradient>
    <linearGradient id="lg-head" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5BE89B"/><stop offset="1" stop-color="#2CC572"/>
    </linearGradient>
    <symbol id="logo" viewBox="0 0 128 128">
      <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#lg-bg)"/>
      <rect x="4.75" y="4.75" width="118.5" height="118.5" rx="27.25" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1.5"/>
      <rect x="18" y="22" width="92" height="84" rx="13" fill="url(#lg-win)"/>
      <path d="M18 42 V35 a13 13 0 0 1 13 -13 H97 a13 13 0 0 1 13 13 V42 Z" fill="#D9DFE6"/>
      <circle cx="31" cy="32" r="4" fill="#FF5F57"/>
      <circle cx="43" cy="32" r="4" fill="#FEBC2E"/>
      <circle cx="55" cy="32" r="4" fill="#28C840"/>
      <line x1="64" y1="61" x2="64" y2="53" stroke="#2CC572" stroke-width="4" stroke-linecap="round"/>
      <circle cx="64" cy="51" r="4.5" fill="#3DDC84"/>
      <rect x="38" y="60" width="52" height="36" rx="12" fill="url(#lg-head)"/>
      <rect x="45" y="69" width="38" height="17" rx="8.5" fill="#10151C"/>
      <circle cx="56" cy="77.5" r="4" fill="#3DDC84"/>
      <circle cx="72" cy="77.5" r="4" fill="#3DDC84"/>
    </symbol>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <filter id="sh2" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.39"/>
    </filter>
    <marker id="ah-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#2CC572"/>
    </marker>
    <marker id="ah-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#4C8DFF"/>
    </marker>
    <marker id="ah-p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#A78BFA"/>
    </marker>
    <marker id="ah-m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#9198A1"/>
    </marker>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B2B4D"/><stop offset="1" stop-color="#0F3A33"/>
    </linearGradient>
    <linearGradient id="art" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A78BFA"/><stop offset="1" stop-color="#4C8DFF"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3DDC84" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#3DDC84" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#E6EDF3" fill-opacity="0.07"/>
    </pattern>
    <linearGradient id="bgg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1117"/><stop offset="1" stop-color="#161B22"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="680" rx="24" fill="#0D1117"/>
  <rect x="0.5" y="0.5" width="1279" height="679" rx="23.5" fill="none" stroke="#30363D"/>
  <use href="#logo" x="40" y="28" width="40" height="40"/>
  <text x="94" y="56" class="s tx b" font-size="26" text-anchor="start">Automation through MCP</text>
  <text x="1240" y="56" class="s mu" font-size="16" text-anchor="end">any app, driven by structured tool calls</text>
<g>
      <rect x="40" y="100" width="190" height="300" rx="16" fill="#1C2128" stroke="#30363D" filter="url(#sh2)"/>
      <rect x="60" y="124" width="150" height="96" rx="10" fill="#262C36"/>
      <path d="M76 152 l14 12 l-14 12" fill="none" stroke="#2CC572" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="100" y="172" width="40" height="5" rx="2.5" fill="#E6EDF3" fill-opacity="0.6"/>
      <rect x="76" y="192" width="96" height="5" rx="2.5" fill="#9198A1" fill-opacity="0.5"/>
      <text x="60" y="258" class="s tx b" font-size="19" text-anchor="start">MCP client</text>
      <text x="60" y="284" class="s mu" font-size="14" text-anchor="start">any MCP-capable</text>
      <text x="60" y="304" class="s mu" font-size="14" text-anchor="start">tool or script</text>
      <rect x="60" y="336" width="150" height="36" rx="8" fill="#262C36" stroke="#30363D"/>
      <text x="135.0" y="359" class="m tx" font-size="13" text-anchor="middle">stdio, JSON-RPC</text>
    </g><g>
      <rect x="278" y="100" width="272" height="300" rx="16" fill="#1C2128" stroke="#30363D" filter="url(#sh2)"/>
      <text x="298" y="136" class="m tx b" font-size="19" text-anchor="start">droidrt_mcp</text>
      <text x="530" y="136" class="s mu" font-size="14" text-anchor="end">server</text><rect x="298" y="156" width="232" height="34" rx="8" fill="#262C36"/><rect x="298" y="156" width="4" height="34" rx="2" fill="#4C8DFF"/><text x="314" y="178" class="m tx" font-size="14" text-anchor="start">get_screen</text><rect x="298" y="198" width="232" height="34" rx="8" fill="#262C36"/><rect x="298" y="198" width="4" height="34" rx="2" fill="#4C8DFF"/><text x="314" y="220" class="m tx" font-size="14" text-anchor="start">find_elements</text><rect x="298" y="240" width="232" height="34" rx="8" fill="#262C36"/><rect x="298" y="240" width="4" height="34" rx="2" fill="#2CC572"/><text x="314" y="262" class="m tx" font-size="14" text-anchor="start">tap</text><rect x="298" y="282" width="232" height="34" rx="8" fill="#262C36"/><rect x="298" y="282" width="4" height="34" rx="2" fill="#2CC572"/><text x="314" y="304" class="m tx" font-size="14" text-anchor="start">type_text</text><rect x="298" y="324" width="232" height="34" rx="8" fill="#262C36"/><rect x="298" y="324" width="4" height="34" rx="2" fill="#A78BFA"/><text x="314" y="346" class="m tx" font-size="14" text-anchor="start">whatsapp_send_message</text><text x="298" y="380" class="s mu" font-size="13.5" text-anchor="start">+ swipe, wait_for, run_intent, ...</text></g><g>
      <rect x="598" y="100" width="170" height="300" rx="16" fill="#1C2128" stroke="#A78BFA" stroke-dasharray="7 5"/>
      <circle cx="683.0" cy="170" r="34" fill="#A78BFA" fill-opacity="0.15"/>
      <g transform="translate(683.0 172) scale(1.7)">
      <path d="M-6 -2 V-7 a6 6 0 0 1 12 0 V-2" fill="none" stroke="#A78BFA" stroke-width="2.6"/>
      <rect x="-9" y="-3" width="18" height="14" rx="3" fill="#A78BFA"/>
      <circle cx="0" cy="3.5" r="2.2" fill="#FFFFFF"/>
    </g>
      <text x="683.0" y="240" class="s tx b" font-size="19" text-anchor="middle">Handshake</text>
      <text x="683.0" y="266" class="m mu" font-size="14" text-anchor="middle">HMAC-SHA256</text>
      <text x="683.0" y="286" class="s mu" font-size="14" text-anchor="middle">nonce and proof</text>
      <rect x="614" y="322" width="138" height="52" rx="8" fill="#262C36" stroke="#30363D"/>
      <text x="683.0" y="344" class="m tx" font-size="13" text-anchor="middle">adb forward</text>
      <text x="683.0" y="363" class="s mu" font-size="12.5" text-anchor="middle">per connection</text>
    </g><g>
      <rect x="816" y="100" width="196" height="300" rx="16" fill="#1C2128" stroke="#30363D" filter="url(#sh2)"/>
      <use href="#logo" x="836" y="122" width="56" height="56"/>
