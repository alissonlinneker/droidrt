<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="470" viewBox="0 0 1280 470" role="img" aria-labelledby="t d">
  <title id="t">How droidrt works</title>
  <desc id="d">Four steps: install an APK, XAPK or Play Store app; a launcher app with the real icon appears; clicking it opens the app in its own window and boots the VM on demand; closing the last window shuts the VM down.</desc>
  <style>
    .s { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif; }
    .m { font-family: ui-monospace, 'SF Mono', Menlo, monospace; }
    .tx { fill: #1F2328; }
    .mu { fill: #59636E; }
    .b { font-weight: 700; }
    .sb { font-weight: 600; }
  </style>
  <defs>
    <linearGradient id="lg-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232A36"/><stop offset="1" stop-color="#0F131A"/>
    </linearGradient>
    <linearGradient id="lg-win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E9EDF2"/>
    </linearGradient>
    <linearGradient id="lg-head" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5BE89B"/><stop offset="1" stop-color="#2CC572"/>
    </linearGradient>
    <symbol id="logo" viewBox="0 0 128 128">
      <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#lg-bg)"/>
      <rect x="4.75" y="4.75" width="118.5" height="118.5" rx="27.25" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1.5"/>
      <rect x="18" y="22" width="92" height="84" rx="13" fill="url(#lg-win)"/>
      <path d="M18 42 V35 a13 13 0 0 1 13 -13 H97 a13 13 0 0 1 13 13 V42 Z" fill="#D9DFE6"/>
      <circle cx="31" cy="32" r="4" fill="#FF5F57"/>
      <circle cx="43" cy="32" r="4" fill="#FEBC2E"/>
      <circle cx="55" cy="32" r="4" fill="#28C840"/>
      <line x1="64" y1="61" x2="64" y2="53" stroke="#2CC572" stroke-width="4" stroke-linecap="round"/>
      <circle cx="64" cy="51" r="4.5" fill="#3DDC84"/>
      <rect x="38" y="60" width="52" height="36" rx="12" fill="url(#lg-head)"/>
      <rect x="45" y="69" width="38" height="17" rx="8.5" fill="#10151C"/>
      <circle cx="56" cy="77.5" r="4" fill="#3DDC84"/>
      <circle cx="72" cy="77.5" r="4" fill="#3DDC84"/>
    </symbol>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
    <filter id="sh2" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.13"/>
    </filter>
    <marker id="ah-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#22B866"/>
    </marker>
    <marker id="ah-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#2F6FEB"/>
    </marker>
    <marker id="ah-p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#7C5CDB"/>
    </marker>
    <marker id="ah-m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#59636E"/>
    </marker>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#CFE0FF"/><stop offset="1" stop-color="#CDF3DF"/>
    </linearGradient>
    <linearGradient id="art" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A78BFA"/><stop offset="1" stop-color="#4C8DFF"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3DDC84" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#3DDC84" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#1F2328" fill-opacity="0.10"/>
    </pattern>
    <linearGradient id="bgg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F3F6F9"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="470" rx="24" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="1279" height="469" rx="23.5" fill="none" stroke="#D1D9E0"/>
  <use href="#logo" x="40" y="28" width="40" height="40"/>
  <text x="94" y="56" class="s tx b" font-size="26" text-anchor="start">How it works</text>
  <text x="1240" y="56" class="s mu" font-size="16" text-anchor="end">from APK to Dock icon in one command</text>
<g>
      <rect x="40" y="92" width="270" height="350" rx="18" fill="#FFFFFF" stroke="#D1D9E0" filter="url(#sh2)"/>
      <rect x="60" y="132" width="230" height="150" rx="14" fill="#EEF2F6"/>
      <circle cx="74" cy="114" r="0" fill="none"/>
      <rect x="60" y="106" width="68" height="20" rx="10" fill="#3DDC84" fill-opacity="0.18"/>
      <text x="94" y="121" class="s b" font-size="12" text-anchor="middle" fill="#13874A" letter-spacing="1">STEP 1</text>
      <g transform="translate(60 132)"><g transform="translate(115 80)">
      <path d="M-44 -6 L0 -26 L44 -6 L0 14 Z" fill="#3DDC84" fill-opacity="0.85"/>
      <path d="M-44 -6 V34 L0 54 V14 Z" fill="#22B866"/>
      <path d="M44 -6 V34 L0 54 V14 Z" fill="#1E9E5A"/>
      <path d="M-22 -16 L22 4" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="5"/>
      <path d="M0 -66 V-36" stroke="#2F6FEB" stroke-width="5" stroke-linecap="round"/>
      <path d="M-11 -46 L0 -33 L11 -46" fill="none" stroke="#2F6FEB" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="54" y="-58" width="48" height="22" rx="6" fill="#FFFFFF" stroke="#D1D9E0"/>
      <text x="78" y="-42" class="m tx b" font-size="12" text-anchor="middle">APK</text>
      <rect x="-104" y="-58" width="52" height="22" rx="6" fill="#FFFFFF" stroke="#D1D9E0"/>
      <text x="-78" y="-42" class="m tx b" font-size="12" text-anchor="middle">XAPK</text>
    </g></g>
      <text x="62" y="318" class="s tx b" font-size="19" text-anchor="start">Install an app</text>
      <text x="62" y="344" class="s mu" font-size="15" text-anchor="start">From an APK, an XAPK</text>
      <text x="62" y="366" class="s mu" font-size="15" text-anchor="start">or the Play Store.</text><rect x="60" y="396" width="230" height="28" rx="8" fill="#EEF2F6" stroke="#D1D9E0"/>
      <text x="72" y="415" class="m tx" font-size="13" text-anchor="start">droidrt install app.apk</text></g><path d="M316 207 H342" stroke="#22B866" stroke-width="3" fill="none" marker-end="url(#ah-g)"/><g>
      <rect x="350" y="92" width="270" height="350" rx="18" fill="#FFFFFF" stroke="#D1D9E0" filter="url(#sh2)"/>
      <rect x="370" y="132" width="230" height="150" rx="14" fill="#EEF2F6"/>
      <circle cx="384" cy="114" r="0" fill="none"/>
      <rect x="370" y="106" width="68" height="20" rx="10" fill="#3DDC84" fill-opacity="0.18"/>
      <text x="404" y="121" class="s b" font-size="12" text-anchor="middle" fill="#13874A" letter-spacing="1">STEP 2</text>
      <g transform="translate(370 132)"><g transform="translate(115 75)">
      <rect x="-92" y="-52" width="184" height="118" rx="10" fill="#FFFFFF" stroke="#D1D9E0" filter="url(#sh2)"/>
      <path d="M-92 -32 V-42 a10 10 0 0 1 10 -10 H82 a10 10 0 0 1 10 10 V-32 Z" fill="#ECEFF3"/>
      <circle cx="-79" cy="-42" r="3.5" fill="#FF5F57"/><circle cx="-68" cy="-42" r="3.5" fill="#FEBC2E"/><circle cx="-57" cy="-42" r="3.5" fill="#28C840"/>
      <text x="14" y="-38" class="s mu sb" font-size="11" text-anchor="middle">Android</text>
      <rect x="-70" y="-20" width="40" height="40" rx="10" fill="url(#art)"/>
      <circle cx="-50" cy="0" r="10" fill="#FFFFFF" fill-opacity="0.7"/>
      <rect x="-20" y="-20" width="40" height="40" rx="10" fill="#2F6FEB"/>
      <rect x="-11" y="-9" width="22" height="18" rx="4" fill="#FFFFFF" fill-opacity="0.8"/>
      <rect x="30" y="-20" width="40" height="40" rx="10" fill="#3DDC84"/>
      <path d="M40 -6 h20 v12 h-12 l-6 5 v-5 h-2 Z" fill="#FFFFFF" fill-opacity="0.9"/>
      <rect x="-68" y="27" width="36" height="6" rx="3" fill="#59636E" fill-opacity="0.5"/>
      <rect x="-18" y="27" width="36" height="6" rx="3" fill="#59636E" fill-opacity="0.5"/>
      <rect x="32" y="27" width="36" height="6" rx="3" fill="#59636E" fill-opacity="0.5"/>
      <rect x="22" y="-26" width="56" height="66" rx="13" fill="none" stroke="#2F6FEB" stroke-width="2.5"/>
    </g></g>
      <text x="372" y="318" class="s tx b" font-size="19" text-anchor="start">A launcher appears</text>
      <text x="372" y="344" class="s mu" font-size="15" text-anchor="start">A .app with the real icon,</text>
      <text x="372" y="366" class="s mu" font-size="15" text-anchor="start">in Dock and Spotlight.</text><rect x="370" y="396" width="230" height="28" rx="8" fill="#EEF2F6" stroke="#D1D9E0"/>
      <text x="382" y="415" class="m tx" font-size="13" text-anchor="start">~/Applications/Android</text></g><path d="M626 207 H652" stroke="#22B866" stroke-width="3" fill="none" marker-end="url(#ah-g)"/><g>
      <rect x="660" y="92" width="270" height="350" rx="18" fill="#FFFFFF" stroke="#D1D9E0" filter="url(#sh2)"/>
      <rect x="680" y="132" width="230" height="150" rx="14" fill="#EEF2F6"/>
      <circle cx="694" cy="114" r="0" fill="none"/>
      <rect x="680" y="106" width="68" height="20" rx="10" fill="#3DDC84" fill-opacity="0.18"/>
      <text x="714" y="121" class="s b" font-size="12" text-anchor="middle" fill="#13874A" letter-spacing="1">STEP 3</text>
      <g transform="translate(680 132)"><g transform="translate(115 75)">
      <rect x="-60" y="-58" width="120" height="122" rx="10" fill="#FFFFFF" stroke="#D1D9E0" filter="url(#sh2)"/>
      <path d="M-60 -38 V-48 a10 10 0 0 1 10 -10 H50 a10 10 0 0 1 10 10 V-38 Z" fill="#ECEFF3"/>
      <circle cx="-47" cy="-48" r="3.5" fill="#FF5F57"/><circle cx="-36" cy="-48" r="3.5" fill="#FEBC2E"/><circle cx="-25" cy="-48" r="3.5" fill="#28C840"/>
      <rect x="-50" y="-28" width="64" height="16" rx="8" fill="#EEF2F6"/>
      <rect x="-14" y="-6" width="64" height="16" rx="8" fill="#3DDC84"/>
      <rect x="-50" y="16" width="76" height="16" rx="8" fill="#EEF2F6"/>
      <rect x="-50" y="44" width="100" height="12" rx="6" fill="#EEF2F6"/>
      <g transform="translate(46 34)">
        <path d="M0 0 L0 26 L7 19 L12 30 L17 28 L12 17 L22 17 Z" fill="#1F2328" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round"/>
      </g>
      <g transform="translate(-82 -30)">
        <circle r="16" fill="#3DDC84"/>
        <path d="M0 -8 V-1" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
        <path d="M-6 -4 a8 8 0 1 0 12 0" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
      </g>
    </g></g>
      <text x="682" y="318" class="s tx b" font-size="19" text-anchor="start">Click to open</text>
      <text x="682" y="344" class="s mu" font-size="15" text-anchor="start">Its own macOS window.</text>
      <text x="682" y="366" class="s mu" font-size="15" text-anchor="start">The VM boots on demand.</text><rect x="680" y="396" width="230" height="28" rx="8" fill="#EEF2F6" stroke="#D1D9E0"/>
      <text x="692" y="415" class="m tx" font-size="13" text-anchor="start">droidrt launch &lt;pkg&gt;</text></g><path d="M936 207 H962" stroke="#22B866" stroke-width="3" fill="none" marker-end="url(#ah-g)"/><g>
      <rect x="970" y="92" width="270" height="350" rx="18" fill="#FFFFFF" stroke="#D1D9E0" filter="url(#sh2)"/>
      <rect x="990" y="132" width="230" height="150" rx="14" fill="#EEF2F6"/>
      <circle cx="1004" cy="114" r="0" fill="none"/>
      <rect x="990" y="106" width="68" height="20" rx="10" fill="#3DDC84" fill-opacity="0.18"/>
      <text x="1024" y="121" class="s b" font-size="12" text-anchor="middle" fill="#13874A" letter-spacing="1">STEP 4</text>
      <g transform="translate(990 132)"><g transform="translate(115 75)">
      <rect x="-60" y="-50" width="120" height="104" rx="10" fill="#FFFFFF" stroke="#D1D9E0" stroke-dasharray="6 5" opacity="0.6"/>
      <path d="M-60 -30 V-40 a10 10 0 0 1 10 -10 H50 a10 10 0 0 1 10 10 V-30 Z" fill="#ECEFF3" opacity="0.6"/>
      <circle cx="-47" cy="-40" r="7" fill="#FF5F57"/>
      <path d="M-50 -43 l6 6 M-44 -43 l-6 6" stroke="#7A1F1A" stroke-width="1.8" stroke-linecap="round"/>
      <g transform="translate(22 14)">
        <circle r="30" fill="#FFFFFF" stroke="#D1D9E0" filter="url(#sh2)"/>
        <path d="M8 -15 a17 17 0 1 0 9 22 a13 13 0 0 1 -9 -22 Z" fill="#7C5CDB"/>
        <text x="-12" y="-6" class="s b" font-size="13" text-anchor="middle" fill="#59636E">z</text>
        <text x="-5" y="-14" class="s b" font-size="10" text-anchor="middle" fill="#59636E">z</text>
      </g>
    </g></g>
      <text x="992" y="318" class="s tx b" font-size="19" text-anchor="start">Close to stop</text>
      <text x="992" y="344" class="s mu" font-size="15" text-anchor="start">Close the last window and</text>
      <text x="992" y="366" class="s mu" font-size="15" text-anchor="start">the VM shuts itself down.</text><rect x="990" y="396" width="230" height="28" rx="8" fill="#EEF2F6" stroke="#D1D9E0"/>
      <text x="1002" y="415" class="m tx" font-size="13" text-anchor="start">idle shutdown</text></g></svg>
