name: Feature request
description: Suggest an improvement or a new capability.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How you would like it to work (commands, options, MCP tools, UI).
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - VM and lifecycle
        - Windows (scrcpy)
        - Launcher and Dock
        - Icons
        - Installation formats
        - MCP server and automation
        - Documentation
        - Other
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This does not require shipping APKs or other third party binaries with droidrt
          required: true
